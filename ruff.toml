# Ruff configuration for MAST_gui.
#
# Mirrors the MAST fleet standard so every repo formats identically. The ruff
# version is pinned in requirements-dev.txt (ruff==0.16.0); config alone is not
# enough — formatter output can differ between ruff versions.

line-length = 125
target-version = "py312"

# MAST_common is no longer checked out inside this repo (it was the `common`
# submodule; it is now a sibling clone, <top>/common/), so there is nothing here
# to exclude. Keep this file scoped to this repo's own sources.

[lint]
# The fleet's rule set, stated as `select` rather than `extend-select`: ruff's own
# defaults have grown over time (0.16 enables ASYNC, TRY, S, PYI, RUF, LOG, PLR, C4
# and TC on top of the historical E4/E7/E9/F), so `extend-select` meant the effective
# rule set changed with the pinned version rather than with a decision -- and here it
# was mostly noise, since RUF012 alone accounted for 30 of ~230 findings, almost all
# of them Django's auto-generated migrations (`dependencies`/`operations` lists ruff
# reads as a mutable class default, which Django never mutates at runtime). Mirrors
# MAST_common's and MAST_unit's ruff.toml, which made the same switch already.
select = [
    "F",   # Pyflakes (runtime errors)
    "E",   # pycodestyle (formatting)
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C90", # mccabe complexity
    "SIM", # flake8-simplify
    "TID", # tidy imports
]
# N999 (invalid module name) is not actionable here: this app's own root package is
# named MAST_gui (matching MAST_common/MAST_control's naming), and the uppercase
# makes it an invalid module name by this rule's standard -- same reason MAST_common
# ignores it for itself.
ignore = ["N999"]

[lint.mccabe]
# A ratchet, not a preference. The default is 10; this is the complexity of the worst
# function in the tree (units/views.py: unit_detail, 32), so anything more tangled
# than what is already here fails. The other three over the default are
# units/views.py: units_list (24), MAST_gui/notification_handler.py:
# update_cache_from_update_request (18) and MAST_gui/views.py: _scheduling_resources
# (14); each one fixed lowers this number in the same commit. Mirrors the convention
# in MAST_common's and MAST_unit's ruff.toml.
max-complexity = 32

[lint.isort]
# `common` is MAST_common, our own shared library -- first-party, grouped with
# the Django apps (core, units, specs, dashboard, ...). Without this, ruff's
# resolver splits the package: bare `from common import ...` lands in the
# first-party block while `from common.config import ...` is treated as
# third-party, so every isort run reshuffles the import block and the next
# person reverts it. It also no longer lives under this repo at all (it is a
# sibling clone), so ruff's path-based resolver could not classify it correctly
# even in principle -- naming it here is the only reliable way.
known-first-party = ["common"]

[format]
# Ruff's Black-compatible formatter.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
