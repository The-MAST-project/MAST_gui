# Continuous integration for MAST_gui.
#
# Lint only, for now: no test suite exists (no test_*.py anywhere in the tree), and
# this is a Django app whose views hit a live configuration database and the control
# API, so an import-level smoke test would need infrastructure this repo doesn't
# carry. Same situation as MAST_control and MAST_spec, neither of which has a test
# job either; MAST_common and MAST_unit both have real test suites, which is why
# their workflows also run pytest.
#
# Lint is BLOCKING and, as of 2026-09-14, failing: `ruff check` reports 233 findings
# and one file needs `ruff format`, all pre-existing. That is deliberate, per the
# fleet convention (see MAST_common's ci.yml) -- the debt is meant to show as red
# until it is cleared, rather than sit in an advisory step nobody reads. ruff.toml
# already mirrors the fleet standard; nothing had been enforcing it before this.
#
# Runs on Linux because ruff is platform-independent and that is also this app's
# actual deployment platform (mast-ns-control).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # ruff.toml sets target-version = "py312"; keep these in step.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        # requirements-dev.txt pins the version, so CI and every workstation agree on
        # what counts as a finding. Nothing else is needed: ruff never imports the code.
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Format
        # Deliberately before `ruff check`: this one is a single `ruff format .` away,
        # so surfacing it first means the cheap half of the debt is not hidden behind
        # the expensive half.
        run: ruff format --check .

      - name: Lint
        run: ruff check .
